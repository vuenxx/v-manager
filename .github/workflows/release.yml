name: Build & Release

on:
  push:
    tags:
      - 'v*'   # v0.1.0, v1.0.0 gibi tag'larda tetiklenir

# Ayni tag'e ikinci bir push gelirse onceki calisma iptal edilir.
# Neden: iki calisma ayni anda release olusturmaya kalkinca dosyalar
# (exe / blockmap / latest.yml) iki ayri taslaga bolunuyordu.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Release olusturup dosya yukleyebilmek icin yazma yetkisi.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Uyarıyı kaldıran komut
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24' # Node sürümünü de güncelleyelim
          cache: 'npm'

      # Tag adi ile package.json surumu ayni degilse build'i durdur.
      # Neden: electron-updater surumu package.json'dan okur; ikisi ayrilirsa
      # dosyalar yanlis tag'e gider ve guncelleme kullaniciya hic ulasmaz.
      - name: Tag ile package.json surumunu dogrula
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag surumu ($TAG) ile package.json surumu ($PKG) uyusmuyor."
            exit 1
          fi

      - name: Bağımlılıkları yükle
        run: npm ci

      # electron-builder'a publish ettirmiyoruz: varsayilani "draft" release
      # oldugu icin dosyalar yayinlanmadan taslakta kaliyordu. Sadece derliyor,
      # yuklemeyi asagida gh ile tek adimda yapiyoruz.
      - name: Derle
        run: npm run build:local

      # Dosya adlarini latest.yml ile birebir esitle.
      # electron-builder diske bosluklu ad yazar ("V-Manager Setup 0.7.2.exe")
      # ama latest.yml'ye tireli adi yazar. Updater latest.yml'deki adi aradigi
      # icin yukledigimiz dosyanin adi da o olmali, yoksa indirme 404 doner.
      - name: Dosya adlarini latest.yml ile esitle
        shell: bash
        run: |
          EXE=$(grep -m1 '^path:' dist/latest.yml | sed 's/^path:[[:space:]]*//' | tr -d '\r')
          [ -n "$EXE" ] || { echo "::error::latest.yml icinde path satiri yok."; exit 1; }
          SRC=$(ls dist/*.exe | head -1)
          if [ "$SRC" != "dist/$EXE" ]; then mv "$SRC" "dist/$EXE"; fi
          SRCMAP=$(ls dist/*.blockmap | head -1)
          if [ "$SRCMAP" != "dist/$EXE.blockmap" ]; then mv "$SRCMAP" "dist/$EXE.blockmap"; fi
          echo "EXE_NAME=$EXE" >> "$GITHUB_ENV"
          ls -la dist/*.exe dist/*.blockmap dist/latest.yml

      # Bu tag icin daha once yarida kalmis release/taslak kaldiysa temizle.
      # Taslak release'ler tag'i rezerve etmedigi icin ayni tag'den birden
      # fazla taslak olusabiliyor; hepsini siliyoruz. Git tag'ine dokunulmaz.
      - name: Eski release ve taslaklari temizle
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$GITHUB_REF_NAME\") | .id" \
          | while read -r id; do
              [ -n "$id" ] || continue
              echo "Siliniyor: release id=$id"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done

      # Uc dosya da tek release'e, tek adimda ve dogrudan yayinlanmis olarak.
      - name: Release olustur ve dosyalari yukle
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/$EXE_NAME" \
            "dist/$EXE_NAME.blockmap" \
            "dist/latest.yml" \
            --title "$VERSION" \
            --generate-notes

      # Yukleme eksikse burada fark edelim; latest.yml olmadan uygulama
      # guncellemeyi hic goremez.
      - name: Yuklemeyi dogrula
        shell: bash
        run: |
          COUNT=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
          if [ "$COUNT" -lt 3 ]; then
            echo "::error::Release'te 3 dosya bekleniyordu, $COUNT bulundu."
            exit 1
          fi
