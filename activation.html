<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'" />
    <title>V-Manager — Aktivasyon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* === Ana programla birebir aynı tema değişkenleri === */
        :root {
            --bg-color:              #050505;
            --sidebar-bg:            #0a0a0a;
            --text-primary:          #f0fff0;
            --text-secondary:        #a0b0a0;
            --accent-color:          #44d62c;
            --accent-hover:          #5ee042;
            --accent-rgb:            68, 214, 44;
            --item-hover:            #101a10;
            --border-color:          #1a251a;
            --card-bg:               #0d0d0d;
            --header-bg:             rgba(10, 10, 10, 0.85);
            --shadow:                0 4px 20px rgba(68, 214, 44, 0.15), 0 2px 10px rgba(0,0,0,0.5);
            --transition-speed:      0.3s;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            -webkit-app-region: drag;
            user-select: none;
        }

        /* ── Header — ana programla aynı stil ── */
        .top-header {
            height: 64px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            flex-shrink: 0;
            -webkit-app-region: drag;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 34px;
            height: 34px;
            object-fit: contain;
            border-radius: 8px;
        }

        .header-brand h3 {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-color), #5ee042);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        /* === Pencere kontrolleri (Windows baslik cubugu yerine) === */
        .window-controls {
            display: flex;
            align-items: stretch;
            align-self: stretch;
            margin-right: -24px;
            border-left: 1px solid var(--border-color);
            -webkit-app-region: no-drag;
        }

        .win-ctrl-btn {
            width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
            color: var(--text-secondary);
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .win-ctrl-btn svg {
            width: 10px;
            height: 10px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.1;
            stroke-linecap: square;
        }

        .win-ctrl-btn:hover {
            background-color: rgba(var(--accent-rgb), 0.14);
            color: var(--accent-color);
        }

        .win-ctrl-close:hover {
            background-color: #e81123;
            color: #ffffff;
        }

        .header-badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 7px;
            border: 1.5px solid var(--accent-color);
            color: var(--accent-color);
            background: rgba(68, 214, 44, 0.05);
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        /* ── Main content area ── */
        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            -webkit-app-region: no-drag;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--shadow);
            animation: fadeUp 0.35s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Başlık ── */
        .card-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.55;
            margin-bottom: 26px;
        }

        /* ── Label ── */
        .field-label {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        /* ── HWID kutusu ── */
        .hwid-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 11px 14px;
            margin-bottom: 22px;
        }

        .hwid-value {
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--accent-color);
            letter-spacing: 0.05em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .copy-btn {
            -webkit-app-region: no-drag;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 7px;
            padding: 5px 12px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition-speed);
            white-space: nowrap;
            font-weight: 600;
        }
        .copy-btn:hover { background: var(--item-hover); color: var(--text-primary); border-color: var(--accent-color); }
        .copy-btn.copied { border-color: var(--accent-color); color: var(--accent-color); }

        /* ── Divider ── */
        .divider {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 20px 0;
        }

        /* ── Kod input ── */
        .code-input {
            width: 100%;
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 11px 14px;
            resize: none;
            height: 72px;
            outline: none;
            transition: border-color var(--transition-speed), box-shadow var(--transition-speed);
            letter-spacing: 0.03em;
            margin-bottom: 16px;
        }
        .code-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(68, 214, 44, 0.12);
        }
        .code-input::placeholder { color: var(--text-secondary); font-family: inherit; }

        /* ── Activate button — ana programdaki buton stiliyle uyumlu ── */
        .btn-activate {
            -webkit-app-region: no-drag;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            border: none;
            border-radius: 10px;
            color: #050505;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity var(--transition-speed), transform 0.15s, box-shadow var(--transition-speed);
            letter-spacing: 0.03em;
            box-shadow: 0 4px 16px rgba(68, 214, 44, 0.25);
        }
        .btn-activate:hover {
            opacity: 0.92;
            box-shadow: 0 6px 24px rgba(68, 214, 44, 0.4);
        }
        .btn-activate:active { transform: scale(0.98); }
        .btn-activate:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        /* ── Status ── */
        .status {
            margin-top: 12px;
            min-height: 0;
            font-size: 12.5px;
            font-weight: 500;
            text-align: center;
            border-radius: 8px;
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.25s;
            opacity: 0;
        }
        .status.show {
            max-height: 60px;
            padding: 9px 14px;
            opacity: 1;
        }
        .status.error   { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.25); }
        .status.success { background: rgba(68, 214, 44, 0.08); color: var(--accent-color); border: 1px solid rgba(68, 214, 44, 0.3); }

        /* ── Footer note ── */
        .footer-note {
            margin-top: 18px;
            font-size: 11.5px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<!-- Header — ana programla aynı görünüm -->
<header class="top-header">
    <div class="header-brand">
        <img src="program_logo.png" alt="V-Manager Logo" class="header-logo" />
        <h3>Manager</h3>
        <span class="header-badge">LİSANS</span>
    </div>

    <div class="window-controls">
        <button id="act-minimize-btn" class="win-ctrl-btn" title="Küçült" aria-label="Küçült">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5 H10" /></svg>
        </button>
        <button id="act-close-btn" class="win-ctrl-btn win-ctrl-close" title="Kapat" aria-label="Kapat">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5 L9.5 9.5 M9.5 0.5 L0.5 9.5" /></svg>
        </button>
    </div>
</header>

<!-- İçerik -->
<div class="content">
    <div class="card">
        <p class="card-title">Aktivasyon Gerekiyor</p>
        <p class="card-subtitle">
            Bu yazılımı kullanmak için geçerli bir aktivasyon koduna ihtiyacınız var.
            Aşağıdaki Makine Kimliğini kopyalayıp geliştiriciyle paylaşın.
        </p>

        <div class="field-label">Makine Kimliği (HWID)</div>
        <div class="hwid-row">
            <span class="hwid-value" id="hwid-display">Yükleniyor…</span>
            <button class="copy-btn" id="copy-btn">Kopyala</button>
        </div>

        <hr class="divider" />

        <div class="field-label">Aktivasyon Kodu</div>
        <textarea
            class="code-input"
            id="activation-code"
            placeholder="Aktivasyon kodunuzu buraya yapıştırın…"
            autocomplete="off"
            spellcheck="false"
        ></textarea>

        <button class="btn-activate" id="activate-btn">Aktive Et</button>

        <div class="status" id="status-msg"></div>

        <p class="footer-note">
            Aktivasyon kodunuz yoksa Makine Kimliğinizi geliştiriciyle paylaşın.
        </p>
    </div>
</div>

<script src="activation_renderer.js"></script>
</body>
</html>
